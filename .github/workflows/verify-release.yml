name: Verify release downloads
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published version to verify
        required: true
        default: v0.1.0
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public packages, formats and SHA256
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: node scripts/verify-release.mjs
